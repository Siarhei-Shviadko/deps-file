file:
  image:
    path: "/deps-platform/deps-file"
  resources: {}


file_settings:
  ENV: presale

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  # Object storage
  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com


migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false


file_consumer:
  image:
    path: "/deps-platform/deps-file"


migrator:
  image:
    path: "/deps-platform/deps-file-migrator"


helm:
  helm_logs_job_enabled: false


csi:
  vault_namespace: 'k8s-presale'
  roleName: 'k8s-presale'
  vaultKubernetesMountPath: 'kubernetes-presale'

service_account:
  serviceAccountName: 'deps-presale'
