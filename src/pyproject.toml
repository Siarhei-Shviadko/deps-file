[tool.poetry]
name = "file"
version = "0.1.0"
description = "Short description of project"
authors = []

[tool.poetry.dependencies]
python = "~3.12"
dependency-injector = "4.48.1"
pydantic = "2.11.7"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "0.116.1"
sqlalchemy = "^2.0.41"
Authlib = "^0.15.3"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
python-multipart = "^0.0.20"
deps-object-storage = {path = "../vendors/deps-object-storage"}
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
wemake-python-styleguide = "^0.18.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.25.6"
wdb = "^3.3.0"
requests-mock = "~1.9.3"

ipdb = "^0.13.9"
see = "^1.4.1"
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
)
'''
